# A release for each tag vX.Y.Z: the installer packages (Installer/package.sh) for Windows and Linux, attached to a
# GitHub release. The editor's File > Update Editor looks for the latest one (Editor/Menhir.Editor.Core/Updates).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (vX.Y.Z), created on the current commit if it does not exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          dotnet test Menhir.slnx

      - name: Package
        run: |
          version="${TAG#v}"
          Installer/package.sh win-x64 --version "$version"
          Installer/package.sh linux-x64 --version "$version"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" artifacts/Menhir-Setup-win-x64.zip artifacts/Menhir-Setup-linux-x64.zip \
            --title "Menhir ${TAG#v}" --generate-notes --target "$GITHUB_SHA"
